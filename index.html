<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./script.js"></script>
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <header>
        <button class="previous-page"><img src="./button-imgs/back.png" alt="back"></button>
        <span>Now playing</span>
        <button class="queue"><img src="./button-imgs/play (1).png" alt="queue"></button>
      </header>

      <div class="wrapper"><div class="img-container">
        <img class="album-cover" src="./imgs/octane.webp" alt="album-cover" />
</div>
        <div class="song-description">
          <h3 id="songName">TMU</h3>
          <span id="artistName">Don Toliver</span>
        </div>
    
      <div class="progress-bar-container">
        <div class="progress-bar"></div>
        <div class="progress-bar-bg"></div>
      </div>
      <div class="time-container">
        <span id="intervalTime">00:00</span> <span id="fullTime"></span>
      </div>

      <div id="audioControls">
        <button id="shuffle"><img src="./button-imgs/shuffle.png" alt="shuffle"></button>
        <button id="lastSong"><img src="./button-imgs/rewind-button.png" alt="last song"></button>
        <button id="play"><img class="play hidden" src="./button-imgs/play-button-arrowhead.png" alt="play"> <img class="pause " src="./button-imgs/pause.png" alt=""></button>
        <button id="nextSong"><img src="./button-imgs/forward-button.png" alt="next song"></button>
        <button id="repeat"><img src="./button-imgs/repeat.png" alt="repeat"></button>
      </div>
    </div>
  </body>
</html>

<audio id="mySong">
  <source src="./audio/Don Toliver - TMU.mp3" />
</audio>
