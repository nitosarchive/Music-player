<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./script.js"></script>
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <header>
        <button class="previous-page">previous</button>
        <span>Now playing</span>
        <button class="queue">queue</button>
      </header>

      <div>
        <img
          class="album-cover"
          src="./imgs/thumb-1920-840846.jpg"
          alt="album-cover"
        />
        <div>
          <h3>Save your Tears</h3>
          <span>The Weeknd</span>
        </div>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar"></div>
        <div class="progress-bar-bg"></div>
      </div>

      <div id="audio-controls">
        <button id="shuffle">shuffle</button>
        <button id="last-song">last</button>
        <button id="play">Play</button>
        <button id="next-song">next</button>
        <button id="repeat">repeat</button>
      </div>
    </div>
  </body>
</html>

<audio id="mySong">
  <source src="./audio/Don Toliver - TMU.mp3" />
</audio>
