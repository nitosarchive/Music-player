<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./script.js"></script>
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <header>
        <button class="previous-page">previous</button>
        <span>Now playing</span>
        <button class="queue">queue</button>
      </header>

      <div><div class="img-container">
        <img class="album-cover" src="./imgs/octane.webp" alt="album-cover" />

        <div>
          <h3 id="songName">TMU</h3>
          <span id="artistName">Don Toliver</span>
        </div>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar"></div>
        <div class="progress-bar-bg"></div>
      </div>
      <div class="time-container">
        <span id="intervalTime">00:00</span> <span id="fullTime"></span>
      </div>

      <div id="audioControls" mute>
        <button id="shuffle">shuffle</button>
        <button id="lastSong">last</button>
        <button id="play">Play</button>
        <button id="nextSong">next</button>
        <button id="repeat">repeat</button>
      </div>
    </div>
  </body>
</html>

<audio id="mySong">
  <source src="./audio/Don Toliver - TMU.mp3" />
</audio>
